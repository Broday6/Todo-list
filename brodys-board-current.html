<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brody's board</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style id="style">
:root{
  --bg:#F7F6F2; --panel:#FFFFFF; --ink:#1B1D21; --muted:#6B6E76; --line:#DAD8D0;
  --accent:#1F4FD6; --accent-soft:#E6ECFB; --red:#C8331F; --red-soft:#FBE7E3;
  --amber:#B8720A; --amber-soft:#FBEFD9; --green:#2E7D4F; --green-soft:#E1F2E7;
  --frozen:#8A8D95; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171B; --panel:#1E2126; --ink:#EDEBE6; --muted:#9A9DA6; --line:#2C2F36;
    --accent:#7C9BFF; --accent-soft:#1F2740; --red:#FF7A66; --red-soft:#3A2220;
    --amber:#F0B34B; --amber-soft:#3A2E17; --green:#6FCF97; --green-soft:#193324; --frozen:#6D7079;
  }
}
:root[data-theme="dark"]{
  --bg:#15171B; --panel:#1E2126; --ink:#EDEBE6; --muted:#9A9DA6; --line:#2C2F36;
  --accent:#7C9BFF; --accent-soft:#1F2740; --red:#FF7A66; --red-soft:#3A2220;
  --amber:#F0B34B; --amber-soft:#3A2E17; --green:#6FCF97; --green-soft:#193324; --frozen:#6D7079;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:18px}
header.top h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.05}
header.top .date{color:var(--muted);margin-top:4px}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat b{font-size:24px;font-weight:700;line-height:1;letter-spacing:-.02em}
.stat span{color:var(--muted);font-size:13px}
.stat.warn b{color:var(--red)}
.stat.q b{color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:900px){.grid{grid-template-columns:5fr 6fr;align-items:start}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel h2{font-size:17px;font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h2 small{color:var(--muted);font-weight:400;font-size:13px}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
/* schedule */
.sched{list-style:none;margin:0;padding:0}
.blk{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:start;padding:9px 8px;border-radius:8px;border-left:3px solid transparent}
.blk+.blk{margin-top:2px}
.blk .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px;white-space:nowrap}
.blk .title{font-weight:500}
.blk .sub{color:var(--muted);font-size:13px;margin-top:2px}
.blk.meeting{background:var(--accent-soft);border-left-color:var(--accent)}
.blk.now{outline:2px solid var(--accent);outline-offset:-2px}
.blk.done .title{text-decoration:line-through;color:var(--muted)}
.blk.done{opacity:.7}
.chk{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.nowtag{display:inline-block;font-size:11px;font-weight:600;color:var(--accent);margin-left:6px;vertical-align:middle}
/* check-in */
.checkin{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.checkin form,.addrow{display:flex;gap:8px;flex-wrap:wrap}
.checkin input[type=text],.addrow input[type=text]{flex:1 1 200px;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.addrow input[type=date],.addrow select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{padding:9px 14px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.log{list-style:none;margin:10px 0 0;padding:0}
.log li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:14px}
.log li:first-child{border-top:0}
.log .lt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.empty{color:var(--muted);font-size:13px;font-style:italic}
/* tasks */
.group{margin-top:14px}
.group:first-of-type{margin-top:0}
.group h3{font-size:14px;font-weight:600;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.group h3 .due{font-weight:400;color:var(--muted);font-size:13px}
.group.frozen h3{color:var(--frozen)}
.tasks{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 6px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .title{font-weight:500;cursor:pointer}
.task .note{color:var(--muted);font-size:13px;margin-top:2px}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task.done{opacity:.65}
.group.frozen .task .title{color:var(--frozen);font-weight:400}
.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.over{background:var(--red-soft);color:var(--red)}
.badge.soon{background:var(--amber-soft);color:var(--amber)}
.badge.ok{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.badge.done{background:var(--green-soft);color:var(--green)}
.badge.frozen{background:transparent;color:var(--frozen);border:1px solid var(--line)}
.details{grid-column:2/4;display:none;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.task.open .details{display:flex}
.details input[type=date],.details select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:13px}
.details textarea{flex:1 1 100%;min-height:52px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:13px;resize:vertical}
.details .del{color:var(--red);background:none;border:0;font-size:13px;padding:6px 4px}
.addrow{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
/* ask claude */
.ask{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
.ask h2{font-size:15px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ask h2 small{color:var(--muted);font-weight:400;font-size:13px}
.askrow{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.askrow textarea{flex:1 1 320px;min-width:0;min-height:42px;max-height:180px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical}
.askrow .btn{flex:0 0 auto}
.thinking{display:inline-block;color:var(--accent);font-size:13px;margin-top:8px}
.askerr{color:var(--red);font-size:13px;margin-top:8px}
.saidit{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px;white-space:pre-wrap}
/* proposal diff card */
.diff{margin-top:12px;border:1px solid var(--accent);border-radius:var(--radius);overflow:hidden}
.diff h3{margin:0;padding:9px 12px;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.diff ul{list-style:none;margin:0;padding:0}
.diff li{padding:8px 12px;border-top:1px solid var(--line);font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start}
.diff li .verb{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:3px;white-space:nowrap}
.diff li.rej{color:var(--muted)}
.diff li.rej .verb{color:var(--red)}
.diff .acts{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg)}
/* copyable draft block */
.draft{margin-top:10px}
.draft textarea{width:100%;min-height:120px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;resize:vertical}
.draft .acts{display:flex;gap:8px;margin-top:6px;align-items:center}
/* status chip */
.chip{position:fixed;right:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.08);display:none}
.chip.show{display:block}
.chip.err{color:var(--red);border-color:var(--red)}
footer{margin-top:22px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.chk,.btn{transition:opacity .15s}}
</style>
</head>

<script id="app">
(function(){
  var GROUPS=[
    {key:"now",label:"This week",sub:""},
    {key:"rocks",label:"Rocks",sub:"Due Sep 30"},
    {key:"hire",label:"Hire",sub:"Daily 30 min until filled"},
    {key:"coverage",label:"Coverage until the hire lands",sub:""},
    {key:"frozen",label:"Frozen until Oct 1",sub:"Not lower priority. Frozen."}
  ];
  var state=JSON.parse(document.getElementById("state").textContent);
  var art=null, readOnly=false, saveTimer=null;

  /* ---------- Claude ("sample" capability, runtime contract 0.2.x) ---------- */
  var sampler=null, samplerTried=false;
  var ask={text:"",busy:false,err:"",reply:"",refocus:false};
  var pending=null;   /* {ops:[],rejected:[],origin:"ask"|task id} */
  var draftBox=null;  /* {text:"",label:""} copyable block */

  var MAXOPS=25;
  function isTime(v){return typeof v==="string"&&/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(v);}
  function isDate(v){return typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v);}
  function isStr(v){return typeof v==="string"&&v.trim().length>0;}
  function groupOK(v){for(var i=0;i<GROUPS.length;i++)if(GROUPS[i].key===v)return true;return false;}
  function clip(s,n){s=String(s==null?"":s);return s.length>n?s.slice(0,n-1)+"…":s;}
  function groupLabel(k){for(var i=0;i<GROUPS.length;i++)if(GROUPS[i].key===k)return GROUPS[i].label;return k;}

  function locateBlock(id){
    for(var k in state.days){
      if(!Object.prototype.hasOwnProperty.call(state.days,k))continue;
      var bl=state.days[k].blocks||[];
      for(var i=0;i<bl.length;i++)if(bl[i].id===id)return {day:k,block:bl[i],i:i};
    }
    return null;
  }
  function dayOf(op){
    if(op.day===undefined||op.day===null||op.day==="")return state.today;
    return isDate(op.day)?op.day:null;
  }

  /* Every mutation Claude proposes is checked here before it can be shown or
     applied. Anything unrecognised is rejected, never guessed at. */
  function validateOp(o){
    if(!o||typeof o!=="object")return {ok:false,why:"Not an object."};
    var op=String(o.op||"");
    var t,b,day;
    if(op==="block.add"){
      day=dayOf(o); if(!day)return {ok:false,why:"Bad day."};
      if(!isTime(o.start)||!isTime(o.end))return {ok:false,why:"Bad start/end time."};
      if(toMin(o.end)<=toMin(o.start))return {ok:false,why:"End is not after start."};
      if(!isStr(o.title))return {ok:false,why:"Missing title."};
      return {ok:true,op:{op:op,day:day,start:o.start,end:o.end,title:clip(o.title,140),
        sub:clip(o.sub||"",400),meeting:o.meeting===true}};
    }
    if(op==="block.move"){
      b=locateBlock(o.id); if(!b)return {ok:false,why:"No block with that id."};
      day=(o.day===undefined||o.day===null||o.day==="")?b.day:(isDate(o.day)?o.day:null);
      if(!day)return {ok:false,why:"Bad day."};
      var st=o.start===undefined?b.block.start:o.start;
      var en=o.end===undefined?b.block.end:o.end;
      if(!isTime(st)||!isTime(en))return {ok:false,why:"Bad start/end time."};
      if(toMin(en)<=toMin(st))return {ok:false,why:"End is not after start."};
      return {ok:true,op:{op:op,id:o.id,day:day,start:st,end:en}};
    }
    if(op==="block.done"){
      b=locateBlock(o.id); if(!b)return {ok:false,why:"No block with that id."};
      if(typeof o.done!=="boolean")return {ok:false,why:"done must be true or false."};
      return {ok:true,op:{op:op,id:o.id,done:o.done}};
    }
    if(op==="block.remove"){
      b=locateBlock(o.id); if(!b)return {ok:false,why:"No block with that id."};
      return {ok:true,op:{op:op,id:o.id}};
    }
    if(op==="task.add"){
      if(!isStr(o.title))return {ok:false,why:"Missing title."};
      if(!groupOK(o.group))return {ok:false,why:"Unknown group."};
      if(o.due!==undefined&&o.due!==""&&!isDate(o.due))return {ok:false,why:"Bad due date."};
      return {ok:true,op:{op:op,group:o.group,title:clip(o.title,160),
        note:clip(o.note||"",600),due:o.due||""}};
    }
    if(op==="task.edit"){
      t=findTask(o.id); if(!t)return {ok:false,why:"No task with that id."};
      var f={};
      if(o.title!==undefined){if(!isStr(o.title))return {ok:false,why:"Bad title."};f.title=clip(o.title,160);}
      if(o.note!==undefined){if(typeof o.note!=="string")return {ok:false,why:"Bad note."};f.note=clip(o.note,600);}
      if(o.due!==undefined){if(o.due!==""&&!isDate(o.due))return {ok:false,why:"Bad due date."};f.due=o.due;}
      if(o.group!==undefined){if(!groupOK(o.group))return {ok:false,why:"Unknown group."};f.group=o.group;}
      var keys=[];for(var k in f)if(Object.prototype.hasOwnProperty.call(f,k))keys.push(k);
      if(!keys.length)return {ok:false,why:"Nothing to change."};
      return {ok:true,op:{op:op,id:o.id,fields:f}};
    }
    if(op==="task.done"){
      t=findTask(o.id); if(!t)return {ok:false,why:"No task with that id."};
      if(typeof o.done!=="boolean")return {ok:false,why:"done must be true or false."};
      return {ok:true,op:{op:op,id:o.id,done:o.done}};
    }
    if(op==="task.remove"){
      t=findTask(o.id); if(!t)return {ok:false,why:"No task with that id."};
      return {ok:true,op:{op:op,id:o.id}};
    }
    if(op==="log.add"){
      if(!isStr(o.text))return {ok:false,why:"Missing text."};
      return {ok:true,op:{op:op,text:clip(o.text,300)}};
    }
    return {ok:false,why:"Unknown change type “"+clip(op,40)+"”."};
  }

  function validateOps(list){
    var ok=[],bad=[];
    if(!Array.isArray(list))return {ops:[],rejected:[]};
    list.slice(0,MAXOPS).forEach(function(raw){
      var r=validateOp(raw);
      if(r.ok)ok.push(r.op);else bad.push({why:r.why,raw:raw});
    });
    return {ops:ok,rejected:bad};
  }

  function describeOp(o){
    var b,t;
    if(o.op==="block.add")return {verb:"Add block",text:o.title+" · "+h12(o.start)+"–"+h12(o.end)+(o.day!==state.today?" on "+shortDate(o.day):"")};
    if(o.op==="block.move"){b=locateBlock(o.id);
      return {verb:"Move",text:(b?b.block.title:o.id)+" → "+(o.day!==b.day?shortDate(o.day)+" ":"")+h12(o.start)+"–"+h12(o.end)};}
    if(o.op==="block.done"){b=locateBlock(o.id);
      return {verb:o.done?"Tick":"Untick",text:b?b.block.title:o.id};}
    if(o.op==="block.remove"){b=locateBlock(o.id);
      return {verb:"Drop block",text:b?b.block.title:o.id};}
    if(o.op==="task.add")return {verb:"Add task",text:o.title+" · "+groupLabel(o.group)+(o.due?" · due "+shortDate(o.due):"")};
    if(o.op==="task.edit"){t=findTask(o.id);var bits=[];
      if(o.fields.title!==undefined)bits.push("title → “"+o.fields.title+"”");
      if(o.fields.due!==undefined)bits.push("due → "+(o.fields.due?shortDate(o.fields.due):"none"));
      if(o.fields.group!==undefined)bits.push("group → "+groupLabel(o.fields.group));
      if(o.fields.note!==undefined)bits.push("note updated");
      return {verb:"Edit",text:(t?t.title:o.id)+": "+bits.join(", ")};}
    if(o.op==="task.done"){t=findTask(o.id);
      return {verb:o.done?"Complete":"Reopen",text:t?t.title:o.id};}
    if(o.op==="task.remove"){t=findTask(o.id);
      return {verb:"Remove task",text:t?t.title:o.id};}
    if(o.op==="log.add")return {verb:"Log",text:o.text};
    return {verb:"?",text:JSON.stringify(o)};
  }

  function applyOps(ops){
    ops.forEach(function(o){
      var b,t,d;
      if(o.op==="block.add"){
        d=state.days[o.day]||(state.days[o.day]={blocks:[],log:[]});
        d.blocks.push({id:uid("b"),start:o.start,end:o.end,title:o.title,sub:o.sub,meeting:o.meeting,done:false});
        d.blocks.sort(function(x,y){return toMin(x.start)-toMin(y.start);});
      } else if(o.op==="block.move"){
        b=locateBlock(o.id); if(!b)return;
        b.block.start=o.start; b.block.end=o.end;
        if(o.day!==b.day){
          state.days[b.day].blocks.splice(b.i,1);
          d=state.days[o.day]||(state.days[o.day]={blocks:[],log:[]});
          d.blocks.push(b.block);
          d.blocks.sort(function(x,y){return toMin(x.start)-toMin(y.start);});
        } else {
          state.days[b.day].blocks.sort(function(x,y){return toMin(x.start)-toMin(y.start);});
        }
      } else if(o.op==="block.done"){
        b=locateBlock(o.id); if(b)b.block.done=o.done;
      } else if(o.op==="block.remove"){
        b=locateBlock(o.id); if(b)state.days[b.day].blocks.splice(b.i,1);
      } else if(o.op==="task.add"){
        state.tasks.push({id:uid("t"),group:o.group,title:o.title,note:o.note,due:o.due,done:false});
      } else if(o.op==="task.edit"){
        t=findTask(o.id); if(!t)return;
        for(var k in o.fields)if(Object.prototype.hasOwnProperty.call(o.fields,k))t[k]=o.fields[k];
      } else if(o.op==="task.done"){
        t=findTask(o.id); if(t)t.done=o.done;
      } else if(o.op==="task.remove"){
        state.tasks=state.tasks.filter(function(x){return x.id!==o.id;});
      } else if(o.op==="log.add"){
        d=state.days[state.today]||(state.days[state.today]={blocks:[],log:[]});
        var n=new Date();
        d.log.push({t:pad(n.getHours())+":"+pad(n.getMinutes()),text:o.text});
      }
    });
  }

  /* ---------- prompts ---------- */
  var OPS_SPEC=[
    'Allowed objects in "ops" (use these shapes exactly, no others):',
    '{"op":"block.add","day":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM","title":"...","sub":"...","meeting":false}',
    '{"op":"block.move","id":"<existing block id>","day":"YYYY-MM-DD","start":"HH:MM","end":"HH:MM"}',
    '{"op":"block.done","id":"<block id>","done":true}',
    '{"op":"block.remove","id":"<block id>"}',
    '{"op":"task.add","group":"now|rocks|hire|coverage|frozen","title":"...","note":"...","due":"YYYY-MM-DD"}',
    '{"op":"task.edit","id":"<task id>","title":"...","note":"...","due":"YYYY-MM-DD","group":"..."}',
    '{"op":"task.done","id":"<task id>","done":true}',
    '{"op":"task.remove","id":"<task id>"}',
    '{"op":"log.add","text":"..."}',
    'Times are 24-hour "HH:MM". Dates are "YYYY-MM-DD". "day" defaults to the board’s current day.',
    'Every id must already exist in the state. Never invent an id. Omit "ops" fields you are not changing.'
  ].join("\n");

  function askPrompt(q){
    return [
      "You are the planning assistant built into Brody’s board, a personal project-management page.",
      "Today is "+todayISO()+". The board is currently showing "+state.today+". Working hours "+state.hours+". Quarter ends "+state.quarterEnd+".",
      "",
      "Reply with ONLY one JSON object, no prose around it:",
      '{"reply":"<at most two short sentences for Brody>","ops":[ ... ]}',
      "",
      OPS_SPEC,
      "",
      "If he asked a question rather than for a change, answer it in \"reply\" and return \"ops\":[].",
      "Only propose changes he actually asked for. Keep \"reply\" short — the page renders the changes itself.",
      "",
      "BOARD STATE:",
      JSON.stringify(stateForPrompt()),
      "",
      "BRODY ASKED:",
      q
    ].join("\n");
  }

  /* Full state, minus the per-task threads (they are sent only for the one
     task being discussed) so the request does not grow with every Q&A. */
  function stateForPrompt(){
    var days={};
    for(var k in state.days){
      if(!Object.prototype.hasOwnProperty.call(state.days,k))continue;
      days[k]={blocks:state.days[k].blocks,log:state.days[k].log};
    }
    return {
      updated:state.updated,hours:state.hours,quarterEnd:state.quarterEnd,
      today:state.today,days:days,
      tasks:state.tasks.map(function(t){
        return {id:t.id,group:t.group,title:t.title,note:t.note,due:t.due,done:t.done,
          threadLength:(t.thread&&t.thread.length)||0};
      })
    };
  }

  function sampleErr(e){
    var c=e&&e.code;
    if(c==="not_granted")return "Claude access was declined for this view.";
    if(c==="rate_limited")return "Too many questions at once — wait a moment.";
    if(c==="prompt_too_large")return "The board is too large to send. Trim old days.";
    if(c==="invalid_json")return "Claude’s answer wasn’t usable. Try rephrasing.";
    if(c==="cancelled")return "";
    if(c==="refused")return "Claude declined to answer that.";
    if(c==="session_expired")return "Your Claude session expired — reload the page.";
    return "Couldn’t reach Claude. Try again.";
  }

  function runAsk(){
    var q=(ask.text||"").trim();
    if(!sampler||ask.busy||!q)return;
    ask.busy=true; ask.err=""; ask.reply=""; pending=null; draftBox=null; render();
    sampler.json(askPrompt(q),{modelTier:"default",cache:false}).then(function(res){
      ask.busy=false; ask.text="";
      ask.reply=(res&&typeof res.reply==="string")?clip(res.reply,600):"";
      var v=validateOps(res&&res.ops);
      pending=(v.ops.length||v.rejected.length)?{ops:v.ops,rejected:v.rejected,origin:"ask"}:null;
      render();
    }).catch(function(e){
      ask.busy=false; ask.err=sampleErr(e); render();
    });
  }

  function diffHTML(){
    if(!pending)return '';
    var h='<div class="diff"><h3>'+(pending.ops.length?pending.ops.length+(pending.ops.length===1?' change':' changes')+' proposed — nothing is applied yet':'No change could be applied')+'</h3><ul>';
    pending.ops.forEach(function(o){
      var d=describeOp(o);
      h+='<li><span class="verb">'+esc(d.verb)+'</span><span>'+esc(d.text)+'</span></li>';
    });
    pending.rejected.forEach(function(r){
      h+='<li class="rej"><span class="verb">Skipped</span><span>'+esc(r.why)+'</span></li>';
    });
    h+='</ul><div class="acts">';
    if(pending.ops.length)h+='<button class="btn" type="button" data-act="apply">Apply</button>';
    h+='<button class="btn ghost" type="button" data-act="cancel">'+(pending.ops.length?'Cancel':'Dismiss')+'</button>';
    h+='</div></div>';
    return h;
  }

  function draftHTML(){
    if(!draftBox)return '';
    return '<div class="draft"><textarea readonly>'+esc(draftBox.text)+'</textarea>'+
      '<div class="acts"><button class="btn ghost" type="button" data-act="copydraft">Copy</button>'+
      '<button class="btn ghost" type="button" data-act="closedraft">Close</button>'+
      '<span class="empty">'+esc(draftBox.label||"Select and copy if the button is blocked.")+'</span></div></div>';
  }

  function askHTML(){
    if(samplerTried&&!sampler)return '';
    var ready=!!sampler;
    var h='<section class="ask"><h2>Ask Claude <small>'+(ready?'proposes changes — you apply them':'connecting…')+'</small></h2>';
    h+='<div class="askrow"><textarea data-ask="1" rows="1" placeholder="push nav to tomorrow and give the stain asset an hour"'+(ready?'':' disabled')+'>'+esc(ask.text)+'</textarea>';
    h+='<button class="btn" type="button" data-act="ask"'+(ready&&!ask.busy?'':' disabled')+'>'+(ask.busy?'Thinking…':'Ask')+'</button>';
    h+='<button class="btn ghost" type="button" data-act="export">Copy state</button></div>';
    if(ask.busy)h+='<div class="thinking">Thinking… this can take up to a minute.</div>';
    if(ask.err)h+='<div class="askerr">'+esc(ask.err)+'</div>';
    if(ask.reply)h+='<div class="saidit">'+esc(ask.reply)+'</div>';
    h+=diffHTML();
    h+=draftHTML();
    h+='</section>';
    return h;
  }

  function copyText(t,label){
    draftBox={text:t,label:label||""};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){chip("Copied");},function(){});
    }
    render();
  }

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function pad(n){return (n<10?"0":"")+n;}
  function todayISO(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function parseISO(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}
  function fmtDate(iso){var d=parseISO(iso);return d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});}
  function shortDate(iso){var d=parseISO(iso);return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});}
  function h12(t){var p=t.split(":"),h=+p[0],m=p[1];var ap=h>=12?"pm":"am";h=h%12;if(h===0)h=12;return h+(m==="00"?"":":"+m)+ap;}
  function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes();}
  function toMin(t){var p=t.split(":");return (+p[0])*60+(+p[1]);}
  function uid(p){return p+Math.random().toString(36).slice(2,7);}

  function dueBadge(t){
    var today=todayISO();
    if(t.done) return '<span class="badge done">Done</span>';
    if(t.group==="frozen") return '<span class="badge frozen">Oct 1</span>';
    if(!t.due) return '<span class="badge ok">No date</span>';
    var n=daysBetween(today,t.due);
    if(n<0) return '<span class="badge over">'+(-n)+'d overdue</span>';
    if(n===0) return '<span class="badge over">Today</span>';
    if(n===1) return '<span class="badge soon">Tomorrow</span>';
    if(n<=3) return '<span class="badge soon">'+n+' days · '+shortDate(t.due)+'</span>';
    return '<span class="badge ok">'+shortDate(t.due)+' · '+n+'d</span>';
  }

  function render(){
    var today=todayISO();
    var day=state.days[state.today]||{blocks:[],log:[]};
    var qLeft=daysBetween(today,state.quarterEnd);
    var open=state.tasks.filter(function(t){return !t.done&&t.group!=="frozen";});
    var overdue=open.filter(function(t){return t.due&&daysBetween(today,t.due)<0;});
    var nm=nowMin(), isToday=(state.today===today);

    var h='';
    h+='<header class="top"><div><h1>Brody\u2019s board</h1><div class="date">'+esc(fmtDate(state.today))+(isToday?'':' \u2014 plan not yet rebuilt for today')+'</div></div>';
    h+='<div class="stats"><div class="stat q"><b>'+qLeft+'</b><span>days left in Q3</span></div><div class="stat"><b>'+open.length+'</b><span>open</span></div><div class="stat'+(overdue.length?' warn':'')+'"><b>'+overdue.length+'</b><span>overdue</span></div></div></header>';

    h+=askHTML();

    h+='<div class="grid">';
    // Today
    h+='<section class="panel"><h2>Today <small>'+esc(state.hours)+'</small></h2>';
    if(!day.blocks.length) h+='<p class="empty">No blocks yet. Open a chat and say \u201cplan my day.\u201d</p>';
    h+='<ul class="sched">';
    var nowFound=false;
    day.blocks.forEach(function(b){
      var isNow=isToday&&!nowFound&&nm>=toMin(b.start)&&nm<toMin(b.end);
      if(isNow)nowFound=true;
      h+='<li class="blk'+(b.meeting?' meeting':'')+(b.done?' done':'')+(isNow?' now':'')+'" data-id="'+esc(b.id)+'">';
      h+='<div class="t">'+h12(b.start)+'\u2013'+h12(b.end)+'</div>';
      h+='<div><div class="title">'+esc(b.title)+(isNow?'<span class="nowtag">now</span>':'')+'</div>'+(b.sub?'<div class="sub">'+esc(b.sub)+'</div>':'')+'</div>';
      h+='<input class="chk" type="checkbox" data-blk="'+esc(b.id)+'"'+(b.done?' checked':'')+' aria-label="Done">';
      h+='</li>';
    });
    h+='</ul>';
    h+='<div class="checkin"><form data-form="log"><input type="text" name="text" placeholder="What are you working on right now?" autocomplete="off"><button class="btn" type="submit">Log it</button></form>';
    h+='<ul class="log">';
    if(!day.log.length) h+='<li class="empty">Nothing logged yet today.</li>';
    day.log.forEach(function(l){h+='<li><span class="lt">'+esc(l.t)+'</span><span>'+esc(l.text)+'</span></li>';});
    h+='</ul></div></section>';

    // Tasks
    h+='<section class="panel"><h2>Tasks <small>tap a title to edit</small></h2>';
    GROUPS.forEach(function(g){
      var list=state.tasks.filter(function(t){return t.group===g.key;});
      if(!list.length&&g.key!=="coverage") return;
      h+='<div class="group '+g.key+'"><h3>'+esc(g.label)+(g.sub?'<span class="due">'+esc(g.sub)+'</span>':'')+'</h3><ul class="tasks">';
      list.forEach(function(t){
        h+='<li class="task'+(t.done?' done':'')+'" data-task="'+esc(t.id)+'">';
        h+='<input class="chk" type="checkbox" data-tchk="'+esc(t.id)+'"'+(t.done?' checked':'')+' aria-label="Done">';
        h+='<div><div class="title" data-toggle="'+esc(t.id)+'">'+esc(t.title)+'</div>'+(t.note?'<div class="note">'+esc(t.note)+'</div>':'')+'</div>';
        h+='<div>'+dueBadge(t)+'</div>';
        h+='<div class="details"><input type="text" data-edit="title" data-id="'+esc(t.id)+'" value="'+esc(t.title)+'" style="flex:1 1 100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:13px">';
        h+='<input type="date" data-edit="due" data-id="'+esc(t.id)+'" value="'+esc(t.due||"")+'">';
        h+='<select data-edit="group" data-id="'+esc(t.id)+'">'+GROUPS.map(function(x){return '<option value="'+x.key+'"'+(x.key===t.group?' selected':'')+'>'+esc(x.label)+'</option>';}).join("")+'</select>';
        h+='<button class="del" type="button" data-del="'+esc(t.id)+'">Remove</button>';
        h+='<textarea data-edit="note" data-id="'+esc(t.id)+'" placeholder="Note">'+esc(t.note||"")+'</textarea></div>';
        h+='</li>';
      });
      if(!list.length) h+='<li class="task"><div></div><div class="empty">Nothing here yet.</div><div></div></li>';
      h+='</ul></div>';
    });
    h+='<form class="addrow" data-form="add"><input type="text" name="title" placeholder="Add a task" autocomplete="off" required><input type="date" name="due"><select name="group">'+GROUPS.map(function(x){return '<option value="'+x.key+'">'+esc(x.label)+'</option>';}).join("")+'</select><button class="btn ghost" type="submit">Add</button></form>';
    h+='</section></div>';

    h+='<footer>Last saved '+esc(new Date(state.updated).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}))+'. Claude reads this board each morning and rebuilds the day from it.'+(readOnly?' This view is read-only.':'')+'</footer>';
    document.getElementById("root").innerHTML=h;
    if(ask.refocus){
      var ab=document.querySelector("[data-ask]");
      if(ab&&!ab.disabled){ab.focus();ab.setSelectionRange(ab.value.length,ab.value.length);}
      ask.refocus=false;
    }
  }

  function pageSource(){
    var json=JSON.stringify(state).replace(/<\//g,"<\\/");
    var style=document.getElementById("style").textContent;
    var app=document.getElementById("app").textContent;
    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Brody\'s board</title>\n<!-- Publish with capabilities {"artifact":{},"sample":{}} - the Ask Claude box and the per-task threads need "sample", self-publish needs "artifact". Omitting either makes them fail silently. -->\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">\n<style id="style">'+style+'</style>\n</head>\n<body>\n<div id="root" class="wrap"></div>\n<div id="chip" class="chip"></div>\n\n<script id="state" type="application/json">\n'+json+'\n<\/script>\n\n<script id="app">'+app+'<\/script>\n</body>\n</html>\n';
  }

  function chip(msg,err){var c=document.getElementById("chip");c.textContent=msg;c.className="chip show"+(err?" err":"");if(!err){clearTimeout(chip._t);chip._t=setTimeout(function(){c.className="chip";},2500);}}

  function save(){
    state.updated=new Date().toISOString();
    render();
    if(readOnly||!art){chip("Saving isn\u2019t available in this view. Changes will be lost on reload.",true);return;}
    clearTimeout(saveTimer);
    chip("Saving\u2026");
    saveTimer=setTimeout(function(){
      art.publish(pageSource()).then(function(){chip("Saved");}).catch(function(e){
        var code=e&&e.code;
        if(code==="conflict") return; // view reloads to the winner
        if(code==="not_writer"||code==="not_granted"||code==="not_declared"){readOnly=true;chip("This view is read-only.",true);render();return;}
        if(code==="rate_limited"){chip("Saving too fast \u2014 try again in a moment.",true);return;}
        chip("Couldn\u2019t save. Try again.",true);
      });
    },900);
  }

  function findTask(id){for(var i=0;i<state.tasks.length;i++)if(state.tasks[i].id===id)return state.tasks[i];}
  function findBlock(id){var d=state.days[state.today];if(!d)return null;for(var i=0;i<d.blocks.length;i++)if(d.blocks[i].id===id)return d.blocks[i];}

  document.addEventListener("change",function(e){
    var el=e.target;
    if(el.dataset.blk){var b=findBlock(el.dataset.blk);if(b){b.done=el.checked;save();}return;}
    if(el.dataset.tchk){var t=findTask(el.dataset.tchk);if(t){t.done=el.checked;save();}return;}
    if(el.dataset.edit){var tt=findTask(el.dataset.id);if(!tt)return;tt[el.dataset.edit]=el.value;save();return;}
  });
  document.addEventListener("click",function(e){
    var act=e.target.closest("[data-act]");
    if(act){
      var a=act.dataset.act;
      if(a==="ask"){ask.refocus=true;runAsk();return;}
      if(a==="apply"){
        if(pending&&pending.ops.length){applyOps(pending.ops);pending=null;ask.reply="";save();}
        return;
      }
      if(a==="cancel"){pending=null;render();return;}
      if(a==="closedraft"){draftBox=null;render();return;}
      if(a==="copydraft"){
        var ta=document.querySelector(".draft textarea");
        if(ta){ta.focus();ta.select();
          if(navigator.clipboard&&navigator.clipboard.writeText){
            navigator.clipboard.writeText(ta.value).then(function(){chip("Copied");},function(){chip("Select the text and copy it manually.",true);});
          }else{chip("Select the text and copy it manually.",true);}
        }
        return;
      }
      if(a==="export"){copyText(JSON.stringify(state,null,2),"Full board state — paste this into a chat.");return;}
    }
    var el=e.target.closest("[data-toggle]");
    if(el){var li=el.closest(".task");li.classList.toggle("open");return;}
    var d=e.target.closest("[data-del]");
    if(d){var id=d.dataset.del;state.tasks=state.tasks.filter(function(t){return t.id!==id;});save();return;}
  });
  document.addEventListener("input",function(e){
    if(e.target.dataset&&e.target.dataset.ask)ask.text=e.target.value;
  });
  document.addEventListener("keydown",function(e){
    if(e.target.dataset&&e.target.dataset.ask&&e.key==="Enter"&&(e.metaKey||e.ctrlKey)){
      e.preventDefault();ask.text=e.target.value;ask.refocus=true;runAsk();
    }
  });

  document.addEventListener("submit",function(e){
    var f=e.target;if(!f.dataset.form)return;e.preventDefault();
    if(f.dataset.form==="log"){var v=f.text.value.trim();if(!v)return;var d=state.days[state.today]||(state.days[state.today]={blocks:[],log:[]});var n=new Date();d.log.push({t:pad(n.getHours())+":"+pad(n.getMinutes()),text:v});save();return;}
    if(f.dataset.form==="add"){var title=f.title.value.trim();if(!title)return;state.tasks.push({id:uid("t"),group:f.group.value,title:title,note:"",due:f.due.value||"",done:false});save();return;}
  });

  /* Re-render on the clock, but never while a field is focused, a call is in
     flight, or a proposal is waiting for a decision. */
  function tick(){
    var a=document.activeElement;
    if(ask.busy||pending||draftBox)return;
    if(a&&a.closest&&a.closest("#root")&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
    render();
  }

  render();
  setInterval(tick,60000);
  if(window.claude&&typeof window.claude.use==="function"){
    window.claude.use("artifact").then(function(ns){art=ns;if(!ns){readOnly=true;}render();});
    window.claude.use("sample").then(function(fn){
      sampler=(typeof fn==="function")?fn:null; samplerTried=true; render();
    },function(){samplerTried=true;render();});
  }else{readOnly=true;samplerTried=true;render();}
})();
</script>
</body>
</html>
